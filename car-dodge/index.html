<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Dodge</title>
<style>
:root{--text:#fff;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#3f8f4a;overflow:hidden;touch-action:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,roadW,laneW,hy,yb,u0;
const LANES=3,ZR=5;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;roadW=Math.min(W*.92,420);laneW=roadW/LANES;hy=H*.3;yb=H-40;u0=yb/H}
addEventListener('resize',resize);resize();
let best=0;try{best=+localStorage.getItem('carDodgeBest')||0}catch(e){}
const laneX=l=>W/2-roadW/2+laneW*(l+.5);
const cw=()=>laneW*.5, ch=()=>laneW*.9, CD=()=>ch()*.25;
const P=y=>1/(1+(u0-y/H)*ZR);
const SY=y=>hy+(yb-hy)*P(y);
const SX=(lx,y)=>W/2+(lx-W/2)*P(y);
const COLORS=['#2979ff','#ffb300','#ab47bc','#26c6da','#8bc34a'];
let car,obs,score,speed,state,dash,spawnT,lane,last=0,trees=[],night=0,jt=-1,jz=0,fl=0,fcd=0,flz=0;
const JD=.75,FLY=10,FCD=20;
function reset(){lane=1;car={x:laneX(1)};obs=[];score=0;speed=260;dash=0;spawnT=.8;state='ready';night=0;jt=-1;jz=0;fl=0;fcd=0;flz=0;trees=[];for(let i=0;i<14;i++)trees.push({side:i%2?1:-1,y:Math.floor(i/2)*(H/6)+Math.random()*40,off:Math.random()*50,r:18+Math.random()*14})}
function steer(d){
  if(state==='over')return;
  if(state==='ready')state='playing';
  lane=Math.max(0,Math.min(LANES-1,lane+d));
}
function press(){if(state==='over')reset()}
function jump(){if(state==='over'){reset();return}if(state==='ready')state='playing';if(jt<0)jt=0}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();steer(-1)}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();steer(1)}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();jump()}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state==='over')reset();else if(state==='playing'&&e.code==='Space'&&score>=100&&fl<=0&&fcd<=0)fl=FLY}
});
const btn=(e,bx,by)=>Math.hypot(e.clientX-bx,e.clientY-by)<38;
c.addEventListener('pointerdown',e=>{
  if(state==='over'){reset();return}
  if(btn(e,48,H-48)){jump();return}
  if(score>=100&&btn(e,W-48,H-48)){if(state==='playing'&&fl<=0&&fcd<=0)fl=FLY;return}
  steer(e.clientX<innerWidth/2?-1:1);
});
function spawn(){
  const lanes=[0,1,2].sort(()=>Math.random()-.5);
  const n=score>8&&Math.random()<.3?2:1;
  for(let i=0;i<n;i++){
    const k=Math.random()<.35?1:0;
    obs.push({lane:lanes[i],y:-ch()*.5,kind:k,color:COLORS[Math.floor(Math.random()*COLORS.length)],p:false});
  }
}
function update(dt){
  car.x+=(laneX(lane)-car.x)*Math.min(1,dt*14);
  night+=((Math.floor(score/100)%2===1?1:0)-night)*Math.min(1,dt*1.2);
  if(jt>=0&&state==='playing'){jt+=dt;if(jt>=JD)jt=-1}
  jz=jt>=0?Math.sin(Math.PI*jt/JD):0;
  if(state==='playing'){if(fl>0){fl-=dt;if(fl<=0){fl=0;fcd=FCD}}else if(fcd>0)fcd-=dt}
  flz+=((fl>0?1:0)-flz)*Math.min(1,dt*3);
  if(state!=='playing')return;
  speed=Math.min(720,260+score*7);
  dash+=speed*dt;
  for(const t of trees){t.y+=speed*dt;if(t.y>H+60){t.y=-60-Math.random()*80;t.off=Math.random()*50;t.r=18+Math.random()*14}}
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=(ch()*2.4+Math.random()*ch()*1.6)/speed}
  const chh=CD(),cy=yb-chh,cwid=cw();
  for(const o of obs){
    o.y+=speed*dt;
    if(!o.p&&o.y>yb){o.p=true;score++}
    const ow=o.kind?cwid*.7:cwid, oh=o.kind?chh*.6:chh;
    if(Math.abs(laneX(o.lane)-car.x)<(ow+cwid)/2-6&&o.y+oh>cy+3&&o.y<yb-3&&jz<.35&&flz<.6){
      state='over';
      if(score>best){best=score;try{localStorage.setItem('carDodgeBest',String(best))}catch(e){}}
    }
  }
  obs=obs.filter(o=>o.y<H+100);
}
function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)}
function shade(h,a){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+a));return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function drawCarB(cx,by,w,color,glow,ns){
  const h=w*.72;
  if(!ns){x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(cx,by,w*.58,h*.14,0,0,7);x.fill()}
  x.fillStyle='#0b0b0b';rr(cx-w*.52,by-h*.3,w*.15,h*.3,3);x.fill();rr(cx+w*.37,by-h*.3,w*.15,h*.3,3);x.fill();
  const g=x.createLinearGradient(0,by-h*.55,0,by);g.addColorStop(0,shade(color,30));g.addColorStop(1,shade(color,-45));
  x.fillStyle=g;rr(cx-w/2,by-h*.55,w,h*.45,w*.06);x.fill();
  x.fillStyle=shade(color,5);x.beginPath();x.moveTo(cx-w*.44,by-h*.5);x.lineTo(cx-w*.34,by-h);x.lineTo(cx+w*.34,by-h);x.lineTo(cx+w*.44,by-h*.5);x.closePath();x.fill();
  const wg=x.createLinearGradient(0,by-h*.95,0,by-h*.55);wg.addColorStop(0,'#26384d');wg.addColorStop(1,'#0e1620');
  x.fillStyle=wg;x.beginPath();x.moveTo(cx-w*.38,by-h*.55);x.lineTo(cx-w*.3,by-h*.93);x.lineTo(cx+w*.3,by-h*.93);x.lineTo(cx+w*.38,by-h*.55);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.2)';x.beginPath();x.moveTo(cx-w*.3,by-h*.6);x.lineTo(cx-w*.22,by-h*.9);x.lineTo(cx-w*.1,by-h*.9);x.lineTo(cx-w*.18,by-h*.6);x.closePath();x.fill();
  if(glow){x.shadowColor='#ff2020';x.shadowBlur=w*.3}
  x.fillStyle='#ff2a2a';rr(cx-w*.47,by-h*.5,w*.22,h*.1,2);x.fill();rr(cx+w*.25,by-h*.5,w*.22,h*.1,2);x.fill();
  x.shadowBlur=0;
  x.fillStyle='#f4f4f0';rr(cx-w*.12,by-h*.33,w*.24,h*.1,1);x.fill();
  x.fillStyle='#16181c';rr(cx-w*.5,by-h*.17,w,h*.08,2);x.fill();
}
function drawBarrelB(cx,by,w){
  const h=w*1.15,r=w/2;
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(cx,by,r*1.1,r*.3,0,0,7);x.fill();
  const g=x.createLinearGradient(cx-r,0,cx+r,0);g.addColorStop(0,'#a63a08');g.addColorStop(.4,'#ff9a4d');g.addColorStop(1,'#a63a08');
  x.fillStyle=g;rr(cx-r,by-h,w,h,w*.12);x.fill();
  x.fillStyle='#fff';x.fillRect(cx-r,by-h*.68,w,h*.14);x.fillRect(cx-r,by-h*.36,w,h*.14);
  x.fillStyle='#ffb066';x.beginPath();x.ellipse(cx,by-h,r,r*.3,0,0,7);x.fill();
}
function drawTree(t){
  const p=P(t.y);if(p<.08)return;
  const sx=W/2+t.side*(roadW/2+30+t.off)*p,sy=SY(t.y),r=t.r*p*1.6;
  x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(sx,sy,r*.9,r*.25,0,0,7);x.fill();
  x.fillStyle='#4a2f1b';x.fillRect(sx-r*.12,sy-r*.9,r*.24,r*.9);
  const g=x.createRadialGradient(sx-r*.3,sy-r*1.6,r*.1,sx,sy-r*1.3,r);g.addColorStop(0,'#6fbf5c');g.addColorStop(1,'#1d5128');
  x.fillStyle=g;x.beginPath();x.arc(sx,sy-r*1.3,r,0,7);x.fill();
}
function drawObs(o){
  const oh=o.kind?CD()*.6:CD(),by=o.y+oh,p=P(by);if(p<.08)return;
  const sx=SX(laneX(o.lane),by),sy=SY(by);
  o.kind?drawBarrelB(sx,sy,cw()*.7*1.4*p):drawCarB(sx,sy,cw()*1.5*p,o.color,false);
}
function txt(s,y,size,al){x.fillStyle='#fff';x.font='bold '+size+'px sans-serif';x.textAlign=al||'center';x.fillText(s,al==='right'?W-16:W/2,y)}
function draw(){
  const sg=x.createLinearGradient(0,0,0,hy);sg.addColorStop(0,'#5aa6ee');sg.addColorStop(1,'#cfe6fb');
  x.fillStyle=sg;x.fillRect(0,0,W,hy+2);
  if(night>.01){const ng=x.createLinearGradient(0,0,0,hy);ng.addColorStop(0,'#04081f');ng.addColorStop(1,'#1b2559');x.globalAlpha=night;x.fillStyle=ng;x.fillRect(0,0,W,hy+2);x.globalAlpha=1}
  x.fillStyle='#2d6a46';
  for(let i=0;i<6;i++){x.beginPath();x.ellipse(W*(i/5)+((i%2)*40-20),hy+2,W*.22,H*.045+(i%3)*H*.01,0,Math.PI,0);x.fill()}
  const GB=['#3f8f4a','#3a8444'],RB=['#3b3e45','#383b42'],ph=yb-hy;
  for(let sy=Math.ceil(hy);sy<H;sy+=2){
    const p=(sy-hy)/ph;if(p<=0)continue;
    const u=u0-(1/p-1)/ZR,t=u*H-dash,b=Math.floor(t/70)&1;
    const rw=roadW/2*p,rb=Math.max(2,rw*.07);
    x.fillStyle=GB[b];x.fillRect(0,sy,W,2);
    x.fillStyle=RB[b];x.fillRect(W/2-rw,sy,rw*2,2);
    x.fillStyle=b?'#e8e8e8':'#d32f2f';x.fillRect(W/2-rw-rb,sy,rb,2);x.fillRect(W/2+rw,sy,rb,2);
    if(!b){x.fillStyle='rgba(255,255,255,.85)';for(let i=1;i<LANES;i++)x.fillRect(W/2+(-roadW/2+laneW*i)*p-Math.max(1,2*p),sy,Math.max(2,4*p),2)}
  }
  trees.slice().sort((a,b)=>a.y-b.y).forEach(drawTree);
  obs.slice().sort((a,b)=>a.y-b.y).forEach(drawObs);
  const lean=(laneX(lane)-car.x)/laneW;
  const s=Math.max(jz,flz),lift=jz*cw()*1.3+flz*cw()*2.8;
  x.fillStyle='rgba(0,0,0,'+(.35*(1-s*.6))+')';x.beginPath();x.ellipse(car.x,yb,cw()*1.5*.58*(1-s*.25),cw()*1.5*.72*.14,0,0,7);x.fill();
  x.save();x.translate(car.x,yb-lift);x.rotate(lean*.12-s*.05);
  if(flz>.02){const w=cw()*1.5,h=w*.72,fw=Math.sin(last/70)*h*.12;x.globalAlpha=flz;x.fillStyle='#e8eef5';for(const sd of[-1,1]){x.beginPath();x.moveTo(sd*w*.42,-h*.45);x.lineTo(sd*w*1.15,-h*.85+fw);x.lineTo(sd*w*1.0,-h*.3+fw*.5);x.lineTo(sd*w*.42,-h*.2);x.closePath();x.fill()}x.globalAlpha=1}
  drawCarB(0,0,cw()*1.5,'#e53935',true,true);x.restore();
  if(night>.01){
    x.fillStyle='rgba(4,8,40,'+(.6*night)+')';x.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){const a=Math.sin(i*12.9898)*43758.5453,b=Math.sin(i*78.233)*12543.351,sx=(a-Math.floor(a))*W,sy=(b-Math.floor(b))*hy*.6;x.globalAlpha=night*(.5+.5*Math.sin(last/400+i));x.fillStyle='#fff';x.fillRect(sx,sy,i%3?1.5:2.5,i%3?1.5:2.5)}
    x.globalAlpha=night;x.fillStyle='#f4f1d8';x.beginPath();x.arc(W*.78,hy*.38,Math.max(14,H*.035),0,7);x.fill();
    x.globalAlpha=1;
    x.globalCompositeOperation='lighter';
    const by0=yb-cw()*.54,ty=hy+(yb-hy)*.2,bg=x.createLinearGradient(0,by0,0,ty);
    bg.addColorStop(0,'rgba(255,240,170,'+.4*night+')');bg.addColorStop(1,'rgba(255,240,170,0)');
    x.fillStyle=bg;x.beginPath();x.moveTo(car.x-cw()*.35,by0);x.lineTo(car.x-roadW*.12,ty);x.lineTo(car.x+roadW*.12,ty);x.lineTo(car.x+cw()*.35,by0);x.closePath();x.fill();
    const tl=(sx,sy,w)=>{const h=w*.72;for(const s of[-1,1]){const lx=sx+s*w*.36,ly=sy-h*.45,gl=x.createRadialGradient(lx,ly,0,lx,ly,w*.3);gl.addColorStop(0,'rgba(255,50,50,.85)');gl.addColorStop(1,'rgba(255,50,50,0)');x.fillStyle=gl;x.fillRect(lx-w*.3,ly-w*.3,w*.6,w*.6)}};
    tl(car.x,yb-lift,cw()*1.5);
    for(const o of obs){if(o.kind)continue;const by=o.y+CD(),p=P(by);if(p<.08)continue;tl(SX(laneX(o.lane),by),SY(by),cw()*1.5*p)}
    x.globalCompositeOperation='source-over';
  }
  const vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.3)');
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  txt(score,52,34);
  if(state==='playing'&&score>=100&&score%100<5)txt(Math.floor(score/100)%2?'Night time!':'Day time!',H*.18,28);
  if(state==='playing'&&score>=100)txt(fl>0?'Flying: '+Math.ceil(fl)+'s':fcd>0?'Fly ready in '+Math.ceil(fcd)+'s':'Tap FLY or press Space',78,15);
  const bt=(cx,cy,lb,on)=>{x.globalAlpha=on?.85:.35;x.fillStyle='rgba(20,20,30,.7)';x.beginPath();x.arc(cx,cy,34,0,7);x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.stroke();x.globalAlpha=1;x.fillStyle='#fff';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(lb,cx,cy+5)};
  if(state!=='over'){bt(48,H-48,'JUMP',true);if(score>=100)bt(W-48,H-48,'FLY',fl<=0&&fcd<=0)}
  txt('Best: '+best,30,15,'right');
  if(state==='ready'){txt('Tap left or right to steer',H/2-20,22);txt('A / D or arrows steer, Up or W jumps',H/2+12,15)}
  if(state==='over'){
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);
    txt('You crashed!',H/2-50,34);txt('Score: '+score,H/2-12,20);txt('Best: '+best,H/2+16,20);txt('Try again',H/2+60,26);txt('Tap anywhere to restart',H/2+88,14);
  }
}
function loop(t){
  const dt=Math.min((t-last)/1000||0,.033);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
