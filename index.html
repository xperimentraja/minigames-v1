<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGames-v1</title>
    <!-- Fixed Tailwind CSS Library Engine Link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mini: {
                            bg: '#050409',       
                            sidebar: '#0e0c15',  
                            card: '#161421',     
                            cardHover: '#1f1c2e',
                            accent: '#6b21a8',   
                            accentLight: '#a855f7',
                            textMuted: '#94a3b8' 
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body class="bg-mini-bg text-slate-100 min-h-screen flex items-center justify-center p-4 select-none">

    <!-- Compact Deck Shell Container -->
    <div class="w-full max-w-[320px] bg-mini-sidebar border border-purple-950/20 rounded-xl p-3 shadow-2xl shadow-black/80">
        
        <!-- Header Ribbon Component -->
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-purple-950/20">
            <div class="flex items-center space-x-1.5">
                <div class="h-5 w-5 rounded bg-mini-accent flex items-center justify-center text-[11px] font-black text-white">🎮</div>
                <span class="text-xs font-black tracking-tight text-white uppercase">Mini<span class="text-mini-accentLight">Games-v1</span></span>
            </div>
            <span class="text-[9px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded">Live Deck</span>
        </div>

        <!-- 2-Widgets Per Row High-Density Display Grid Matrix (Exactly 8 Slots Max) -->
        <div class="grid grid-cols-2 gap-2">
            
            <!-- Widget 1: Ludo -->
            <a href="./ludo/index.html" class="group flex items-center p-2 bg-mini-card border border-purple-950/10 rounded-lg hover:bg-mini-cardHover hover:border-mini-accentLight/30 transition-all duration-100">
                <div class="h-5 w-5 rounded bg-slate-950 border border-slate-800/60 flex items-center justify-center flex-shrink-0 mr-2">
                    <svg class="w-3 h-3 group-hover:scale-110 transition duration-100" viewBox="0 0 16 16" fill="none">
                        <rect x="1" y="1" width="6" height="6" fill="#EF4444"/>
                        <rect x="9" y="1" width="6" height="6" fill="#3B82F6"/>
                        <rect x="1" y="9" width="6" height="6" fill="#F59E0B"/>
                        <rect x="9" y="9" width="6" height="6" fill="#10B981"/>
                    </svg>
                </div>
                <span class="text-[11px] font-black text-slate-200 group-hover:text-mini-accentLight transition truncate">Ludo</span>
            </a>

            <!-- Widget 2: Trampoline -->
            <a href="./trampoline/index.html" class="group flex items-center p-2 bg-mini-card border border-purple-950/10 rounded-lg hover:bg-mini-cardHover hover:border-mini-accentLight/30 transition-all duration-100">
                <div class="h-5 w-5 rounded bg-slate-950 border border-slate-800/60 flex items-center justify-center flex-shrink-0 mr-2">
                    <svg class="w-3 h-3 text-emerald-400 group-hover:scale-110 transition duration-100" viewBox="0 0 16 16" fill="none">
                        <path d="M2 11 Q8 15 14 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="8" cy="5" r="1.5" fill="currentColor"/>
                    </svg>
                </div>
                <span class="text-[11px] font-black text-slate-200 group-hover:text-mini-accentLight transition truncate">Trampoline</span>
            </a>

            <!-- Widget 3: Car Dodge -->
            <a href="./car-dodge/index.html" class="group flex items-center p-2 bg-mini-card border border-purple-950/10 rounded-lg hover:bg-mini-cardHover hover:border-mini-accentLight/30 transition-all duration-100">
                <div class="h-5 w-5 rounded bg-slate-950 border border-slate-800/60 flex items-center justify-center flex-shrink-0 mr-2">
                    <svg class="w-3 h-3 text-slate-500 group-hover:scale-110 transition duration-100" viewBox="0 0 16 16" fill="none">
                        <line x1="4" y1="0" x2="4" y2="16" stroke="currentColor" stroke-width="1"/>
                        <line x1="12" y1="0" x2="12" y2="16" stroke="currentColor" stroke-width="1"/>
                        <rect x="7" y="10" width="2" height="4" fill="#3B82F6"/>
                    </svg>
                </div>
                <span class="text-[11px] font-black text-slate-200 group-hover:text-mini-accentLight transition truncate">Car Dodge</span>
            </a>

            <!-- Widget 4: Bird Obby -->
            <a href="./bird-obby/index.html" class="group flex items-center p-2 bg-mini-card border border-purple-950/10 rounded-lg hover:bg-mini-cardHover hover:border-mini-accentLight/30 transition-all duration-100">
                <div class="h-5 w-5 rounded bg-slate-950 border border-slate-800/60 flex items-center justify-center flex-shrink-0 mr-2">
                    <svg class="w-3 h-3 text-purple-400 group-hover:scale-110 transition duration-100" viewBox="0 0 16 16" fill="none">
                        <circle cx="4" cy="8" r="1.5" fill="currentColor"/>
                        <rect x="11" y="1" width="2" height="4" fill="#4B5563"/>
                        <rect x="11" y="11" width="2" height="4" fill="#4B5563"/>
                    </svg>
                </div>
                <span class="text-[11px] font-black text-slate-200 group-hover:text-mini-accentLight transition truncate">Bird Obby</span>
            </a>

            <!-- Empty Placeholder Slot 5 -->
            <div class="flex items-center p-2 bg-slate-950/20 border border-dashed border-purple-950/10 rounded-lg opacity-25">
                <div class="h-5 w-5 rounded border border-slate-700 flex items-center justify-center mr-2 text-[9px] font-mono text-slate-500">+</div>
                <span class="text-[11px] font-bold text-slate-500 truncate">Empty Slot</span>
            </div>

            <!-- Empty Placeholder Slot 6 -->
            <div class="flex items-center p-2 bg-slate-950/20 border border-dashed border-purple-950/10 rounded-lg opacity-25">
                <div class="h-5 w-5 rounded border border-slate-700 flex items-center justify-center mr-2 text-[9px] font-mono text-slate-500">+</div>
                <span class="text-[11px] font-bold text-slate-500 truncate">Empty Slot</span>
            </div>

            <!-- Empty Placeholder Slot 7 -->
            <div class="flex items-center p-2 bg-slate-950/20 border border-dashed border-purple-950/10 rounded-lg opacity-25">
                <div class="h-5 w-5 rounded border border-slate-700 flex items-center justify-center mr-2 text-[9px] font-mono text-slate-500">+</div>
                <span class="text-[11px] font-bold text-slate-500 truncate">Empty Slot</span>
            </div>

            <!-- Empty Placeholder Slot 8 -->
            <div class="flex items-center p-2 bg-slate-950/20 border border-dashed border-purple-950/10 rounded-lg opacity-25">
                <div class="h-5 w-5 rounded border border-slate-700 flex items-center justify-center mr-2 text-[9px] font-mono text-slate-500">+</div>
                <span class="text-[11px] font-bold text-slate-500 truncate">Empty Slot</span>
            </div>

        </div>
    </div>

</body>
</html>
